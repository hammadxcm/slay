name: Version Bump

on:
  workflow_dispatch:
    inputs:
      type:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions: {}

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Credentials are persisted on purpose: the "Push commit and tag" step pushes with git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm run build

      - run: npm test

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: npm version "$BUMP_TYPE"
        env:
          BUMP_TYPE: ${{ inputs.type }}

      - name: Sync jsr.json version and re-tag
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          node -e "
            const fs = require('fs');
            const jsr = JSON.parse(fs.readFileSync('jsr.json', 'utf8'));
            jsr.version = '$VERSION';
            fs.writeFileSync('jsr.json', JSON.stringify(jsr, null, 2) + '\n');
          "
          git add jsr.json
          git commit --amend --no-edit
          git tag -f "v${VERSION}"

      - name: Push commit and tag
        run: git push && git push --tags --force

      - name: Trigger release
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          gh workflow run Release -f tag="v${VERSION}"
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
